services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_dev_password
      POSTGRES_DB: campus_complaints
    ports:
      - "5432:5432"
    volumes:
      - campus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_complaints"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campus_postgres_data: