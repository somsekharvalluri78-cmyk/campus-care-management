services:
  - type: web
    name: campus-care
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:setup --workspace backend && npm run db:seed --workspace backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-care-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: '*'

databases:
  - name: campus-care-db
    plan: free
    databaseName: campus_care
    user: campus_user
